[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-notes"
version = "0.1.0"
description = "Obsidian-native literature management core (canonical paper notes, citation keys, PDF workflow)."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31,<3",
    "PyMuPDF>=1.24,<2",
    "pydantic>=2.8,<3",
    "ruamel.yaml>=0.18,<0.19",
]

[project.scripts]
paper-notes = "paper_notes.cli:main"

[tool.setuptools.packages.find]
include = ["paper_notes*"]
